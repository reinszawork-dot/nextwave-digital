<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Side Hustle CashBook</title>
  <meta name="description" content="Track every rand your side hustles make: cash book, income streams, who owes you, tax set-aside and savings goals.">
  <meta name="theme-color" content="#080B25">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>/* /cashbook without the slash would break relative files */ if (location.protocol !== 'file:' && !location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) location.replace(location.pathname + '/' + location.hash);</script>
  <script>try { if (localStorage.getItem('shcb.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
</head>
<body>
  <div class="arcade-bg" aria-hidden="true"><i style="--x:6%;--d:-3s;--t:26s;--c:#39FF70"></i><i style="--x:14%;--d:-17s;--t:31s;--c:#00E5FF"></i><i style="--x:23%;--d:-9s;--t:24s;--c:#FF368B"></i><i style="--x:35%;--d:-21s;--t:33s;--c:#FFD23F"></i><i style="--x:44%;--d:-5s;--t:28s;--c:#39FF70"></i><i style="--x:52%;--d:-14s;--t:35s;--c:#8F6BFF"></i><i style="--x:61%;--d:-26s;--t:27s;--c:#00E5FF"></i><i style="--x:70%;--d:-8s;--t:30s;--c:#39FF70"></i><i style="--x:78%;--d:-19s;--t:25s;--c:#FF368B"></i><i style="--x:86%;--d:-12s;--t:34s;--c:#00E5FF"></i><i style="--x:93%;--d:-2s;--t:29s;--c:#FFD23F"></i><i style="--x:30%;--d:-29s;--t:37s;--c:#39FF70"></i></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true" id="brandMark"></span>
        <span class="brand-name"><b>HUSTLE</b><b class="g">CASHBOOK</b><small>Track. Save. Grow.</small></span>
        <button class="icon-btn only-mobile" id="navClose" aria-label="Close menu"><i data-i="x"></i></button>
      </div>
      <nav id="nav"></nav>
      <div class="side-card">
        <div class="side-card-icon"><i data-i="shield"></i></div>
        <b>Your data stays here</b>
        <p>Everything is saved in this browser. Back it up from Settings.</p>
        <a class="btn btn-primary btn-sm" href="#/settings">Back up now</a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="navOpen" aria-label="Open menu"><i data-i="menu"></i></button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="top-actions">
          <button class="btn btn-primary btn-sm hide-xs" data-action="add-tx"><i data-i="plus"></i>Add transaction</button>
          <button class="icon-btn" id="themeBtn" aria-label="Switch between light and dark"><i data-i="sun"></i></button>
          <div class="pop-wrap"><button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"><i data-i="bell"></i><span class="dot" id="bellDot" hidden></span></button>
            <div class="popover" id="bellPop" hidden></div>
          </div>
          <div class="pop-wrap">
            <button class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-label="Profile and account menu"><span class="avatar" id="avatar">?</span><i data-i="chev-down" class="hide-xs"></i></button>
            <div class="popover" id="profilePop" hidden></div>
          </div>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <button class="fab" data-action="add-tx" aria-label="Add transaction"><i data-i="plus"></i></button>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/dashboard" data-tab="dashboard"><i data-i="grid"></i><span>Home</span></a>
    <a href="#/cashbook" data-tab="cashbook"><i data-i="book"></i><span>Transactions</span></a>
    <button type="button" class="tab-add" data-action="add-tx" aria-label="Add transaction"><i data-i="plus"></i></button>
    <a href="#/goals" data-tab="goals"><i data-i="target"></i><span>Goals</span></a>
    <button type="button" id="tabMore" aria-label="More pages"><i data-i="menu"></i><span>More</span></button>
  </nav>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="charts.js"></script>
  <script src="pixels.js"></script>
  <script src="app.js"></script>
</body>
</html>
